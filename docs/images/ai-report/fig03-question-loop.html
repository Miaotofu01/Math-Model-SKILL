<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>逐问循环</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #ffffff; color: #1a1a1a; font-family: 'Geist', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; -webkit-font-smoothing: antialiased; }
  svg { display: block; }
  .caption { font-size: 12px; color: #6b7280; text-align: center; padding-top: 8px; line-height: 16px; font-weight: 400; }
</style>
</head>
<body>
<svg viewBox="0 0 1040 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig03-title fig03-desc">
  <title id="fig03-title">逐问循环</title>
  <desc id="fig03-desc">每个小问独立执行阶段一至十，完成后判断是否还有下一小问，有则循环，没有则进入阶段十一至十三的跨问整合与终审。</desc>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
  </defs>

  <!-- 入口 -->
  <line x1="520" y1="48" x2="520" y2="64" stroke="#4f5d75" stroke-width="1.5"/>
  <line x1="520" y1="64" x2="136" y2="64" stroke="#4f5d75" stroke-width="1.5"/>
  <line x1="136" y1="64" x2="136" y2="112" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 逐问循环区 -->
  <rect x="32" y="88" width="976" height="212" rx="12" fill="rgba(46,90,168,0.04)" stroke="rgba(26,26,26,0.12)" stroke-width="1"/>
  <text x="48" y="104" fill="#4f5d75" font-size="12" font-weight="500">阶段一~十 · 每个小问独立执行</text>

  <!-- 行一箭头 -->
  <line x1="224" y1="132" x2="240" y2="132" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="416" y1="132" x2="432" y2="132" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="608" y1="132" x2="624" y2="132" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="800" y1="132" x2="816" y2="132" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="904" y1="152" x2="904" y2="248" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- 行二箭头（右到左） -->
  <line x1="816" y1="268" x2="800" y2="268" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="624" y1="268" x2="608" y2="268" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="432" y1="268" x2="416" y2="268" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="240" y1="268" x2="224" y2="268" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="136" y1="288" x2="136" y2="320" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 判定分支 -->
  <line x1="204" y1="372" x2="280" y2="372" stroke="#4f5d75" stroke-width="1.5"/>
  <line x1="280" y1="372" x2="280" y2="84" stroke="#4f5d75" stroke-width="1.5"/>
  <line x1="280" y1="84" x2="136" y2="84" stroke="#4f5d75" stroke-width="1.5"/>
  <line x1="136" y1="84" x2="136" y2="112" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="288" y="220" width="96" height="16" rx="2" fill="#ffffff"/>
  <text x="336" y="232" fill="#4f5d75" font-size="12" font-weight="500" text-anchor="middle">是 · 下一小问</text>

  <line x1="136" y1="424" x2="136" y2="468" stroke="#4f5d75" stroke-width="1.5"/>
  <line x1="136" y1="468" x2="360" y2="468" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="144" y="432" width="28" height="16" rx="2" fill="#ffffff"/>
  <text x="158" y="444" fill="#4f5d75" font-size="12" font-weight="500" text-anchor="middle">否</text>

  <!-- 节点 -->
  <rect x="432" y="8" width="176" height="40" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
  <text x="520" y="36" fill="#1a1a1a" font-size="12" font-weight="600" text-anchor="middle">赛题 problem.json</text>

  <rect x="48" y="112" width="176" height="40" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
  <text x="136" y="140" fill="#1a1a1a" font-size="12" font-weight="600" text-anchor="middle">阶段一 · 文献</text>
  <rect x="240" y="112" width="176" height="40" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
  <text x="328" y="140" fill="#1a1a1a" font-size="12" font-weight="600" text-anchor="middle">阶段二 · 数据</text>
  <rect x="432" y="112" width="176" height="40" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
  <text x="520" y="140" fill="#1a1a1a" font-size="12" font-weight="600" text-anchor="middle">阶段三 · 假设</text>
  <rect x="624" y="112" width="176" height="40" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
  <text x="712" y="140" fill="#1a1a1a" font-size="12" font-weight="600" text-anchor="middle">阶段四 · 建模</text>
  <rect x="816" y="112" width="176" height="40" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
  <text x="904" y="140" fill="#1a1a1a" font-size="12" font-weight="600" text-anchor="middle">阶段五 · 实现</text>

  <rect x="816" y="248" width="176" height="40" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
  <text x="904" y="276" fill="#1a1a1a" font-size="12" font-weight="600" text-anchor="middle">阶段六 · 计算</text>
  <rect x="624" y="248" width="176" height="40" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
  <text x="712" y="276" fill="#1a1a1a" font-size="12" font-weight="600" text-anchor="middle">阶段七 · 合理性</text>
  <rect x="432" y="248" width="176" height="40" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
  <text x="520" y="276" fill="#1a1a1a" font-size="12" font-weight="600" text-anchor="middle">阶段八 · 可视化</text>
  <rect x="240" y="248" width="176" height="40" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
  <text x="328" y="276" fill="#1a1a1a" font-size="12" font-weight="600" text-anchor="middle">阶段九 · 稳健</text>
  <rect x="48" y="248" width="176" height="40" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
  <text x="136" y="276" fill="#1a1a1a" font-size="12" font-weight="600" text-anchor="middle">阶段十 · 收尾</text>

  <polygon points="136,320 204,372 136,424 68,372" fill="rgba(46,90,168,0.08)" stroke="#2e5aa8" stroke-width="1.5"/>
  <text x="136" y="368" fill="#2e5aa8" font-size="12" font-weight="600" text-anchor="middle">还有下一</text>
  <text x="136" y="388" fill="#2e5aa8" font-size="12" font-weight="600" text-anchor="middle">小问？</text>

  <rect x="360" y="448" width="320" height="40" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
  <text x="520" y="476" fill="#1a1a1a" font-size="12" font-weight="600" text-anchor="middle">阶段十一 ~ 十三 · 跨问整合 / 写作 / 终审</text>
</svg>
<div class="caption">逐问循环</div>
</body>
</html>
